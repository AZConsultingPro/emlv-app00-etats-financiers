<script data-emlv-carnet-guide>
/* Shared help. Delegates the final action to each application's existing exporter/importer. */
(() => {
 'use strict';
 if(document.getElementById('emlv-carnet-guide'))return;
 const style=document.createElement('style');
 style.textContent=`#emlv-common-nav{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px max(20px,calc((100% - 1280px)/2));background:#fff;border-bottom:1px solid #d9ccaa;color:#145b57;font:14px/1.5 Arial,sans-serif}#emlv-common-nav a{color:#086d66;text-decoration:underline;text-underline-offset:3px;font-weight:700}#emlv-common-nav span{font-size:12px}#emlv-carnet-guide{box-sizing:border-box;color:#173e3a;background:#fff;border:1px solid #b39a60;border-radius:18px;padding:0;width:min(700px,calc(100% - 24px));max-width:700px;max-height:90dvh;overflow:auto;font:16px/1.6 Arial,sans-serif;box-shadow:0 24px 80px #001e2840}#emlv-carnet-guide::backdrop{background:#092b3b99}#emlv-carnet-guide .cg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:24px 28px 12px;border-bottom:1px solid #e7e5dc}#emlv-carnet-guide h2{font:700 30px/1.15 Georgia,serif;color:#14433e;margin:6px 0 12px}#emlv-carnet-guide .cg-eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#08766d;margin:0}#emlv-carnet-guide .cg-content{padding:12px 28px 26px}#emlv-carnet-guide ol{padding-left:25px;margin:15px 0}#emlv-carnet-guide li{padding:0 0 14px 8px}#emlv-carnet-guide p{margin:9px 0}#emlv-carnet-guide .cg-note{background:#faf8f1;border-left:3px solid #ac9156;padding:12px 16px;border-radius:4px}#emlv-carnet-guide .cg-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}#emlv-carnet-guide button{box-sizing:border-box;min-height:44px;border:1px solid #9eac9e;border-radius:9px;background:#fff;color:#155b55;font:700 15px/1.4 Arial,sans-serif;padding:10px 15px;cursor:pointer}#emlv-carnet-guide .cg-primary{background:#08786e;color:#fff;border-color:#08786e}#emlv-carnet-guide button:focus-visible{outline:3px solid #b49345;outline-offset:3px}#emlv-carnet-guide .cg-status:empty{display:none}#emlv-carnet-guide .cg-status{padding:12px;background:#edf8f3}#emlv-carnet-guide strong{font-weight:700}#emlv-carnet-guide [hidden]{display:none!important}@media(max-width:480px){#emlv-carnet-guide .cg-head{padding:20px 18px 8px;gap:8px}#emlv-carnet-guide .cg-content{padding:10px 18px 22px}#emlv-carnet-guide h2{font-size:25px}#emlv-carnet-guide .cg-actions button{width:100%}#emlv-common-nav{padding:10px 18px}}@media print{#emlv-common-nav,#emlv-carnet-guide{display:none!important}}`;
 document.head.append(style);
 const dialog=document.createElement('dialog');dialog.id='emlv-carnet-guide';dialog.setAttribute('aria-labelledby','cg-title');
 dialog.innerHTML=`<div class="cg-head"><div><p class="cg-eyebrow">Mon carnet · mode d’emploi</p><h2 id="cg-title"></h2></div><button type="button" data-cg-close aria-label="Fermer le guide">Fermer</button></div><div class="cg-content"><div id="cg-body"></div><p class="cg-status" id="cg-status" role="status"></p><div class="cg-actions"><button type="button" class="cg-primary" id="cg-launch"></button><button type="button" data-cg-close>Revenir à mon travail</button></div></div>`;
 document.body.append(dialog);
 const bodies={
 export:`<p>Votre carnet est un <strong>fichier JSON</strong> : il conserve vos réponses et votre progression dans cette application. Vous n’avez pas besoin de l’ouvrir ni de le modifier.</p><ol><li><strong>Télécharger le carnet.</strong> Cliquez sur « Télécharger mon carnet JSON » ci-dessous. Si le navigateur vous demande où l’enregistrer, choisissez un dossier facile à retrouver.</li><li><strong>Le retrouver.</strong> Ouvrez le dossier <strong>Téléchargements</strong> de votre ordinateur ou la liste des téléchargements de votre navigateur. Sur téléphone, regardez dans l’application <strong>Fichiers</strong> ou le gestionnaire de fichiers, puis Téléchargements. Le nom du fichier se termine par <strong>.json</strong>.</li><li><strong>Conserver une copie.</strong> Vous pouvez garder le JSON sur votre appareil ou l’ajouter à votre <strong>Drive personnel</strong> (Google Drive, OneDrive…). Dans votre espace personnel, utilisez la commande d’ajout ou de chargement de fichier et sélectionnez le JSON. Gardez son format ; ne le convertissez pas en document.</li><li><strong>L’envoyer à l’enseignant.</strong> Depuis votre adresse mail <strong>Vinci</strong>, rédigez un message à l’adresse communiquée en cours. Indiquez votre nom, votre promotion, le chapitre et l’application ou le module. Utilisez le <strong>trombone / Joindre un fichier</strong>, puis sélectionnez le JSON dans Téléchargements. Si le fichier est seulement dans votre Drive, téléchargez-en d’abord une copie sur l’appareil.</li><li><strong>Vérifier puis envoyer.</strong> Vérifiez que le fichier <strong>.json apparaît bien en pièce jointe</strong>, puis envoyez le mail. Joignez le fichier lui-même pour permettre à l’enseignant de suivre votre progression.</li></ol><p class="cg-note"><strong>À retenir :</strong> télécharger ou sauvegarder dans votre Drive n’envoie rien à l’enseignant. Exportez une nouvelle copie après avoir avancé. Gardez chaque carnet avec l’application qui l’a produit.</p>`,
 import:`<p>Importer permet de <strong>reprendre une progression déjà sauvegardée</strong>, par exemple après un changement d’ordinateur. Il faut le fichier JSON exporté depuis <strong>cette même application</strong>.</p><ol><li><strong>Retrouver le bon carnet.</strong> Cherchez votre fichier <strong>.json</strong> dans Téléchargements ou dans le dossier où vous l’avez conservé. S’il est dans votre Drive, téléchargez-le d’abord sur cet appareil. Une pièce jointe reçue par mail doit également être téléchargée.</li><li><strong>Garder le travail actuel.</strong> L’import remplace la progression de cette application sur cet appareil ; il ne fusionne pas les deux carnets. Si vous souhaitez conserver le travail actuel, fermez ce guide et exportez-le d’abord.</li><li><strong>Choisir le fichier.</strong> Cliquez sur « Choisir mon carnet JSON » ci-dessous, retrouvez le fichier et sélectionnez-le. Choisissez bien le carnet du chapitre et de l’application concernés.</li><li><strong>Contrôler et confirmer.</strong> L’application vérifie le fichier avant de vous demander de confirmer le remplacement. Un fichier incompatible est refusé. Annuler conserve le travail actuel.</li><li><strong>Reprendre.</strong> Vérifiez la progression restaurée et, lorsqu’elle est renseignée dans le carnet, votre identité. Poursuivez le travail puis exportez une nouvelle copie en fin de séance.</li></ol><p class="cg-note"><strong>Ce qui se passe :</strong> le fichier est lu sur votre appareil. L’import ne transmet rien à l’enseignant, ne modifie pas le JSON d’origine et ne récupère pas les résultats Google Forms. Les carnets des autres applications restent distincts.</p>`
 };
 let trigger=null,mode='export',bypass=false,origin=null;
 function show(kind,element){mode=kind;trigger=element;origin=document.activeElement;dialog.querySelector('#cg-title').textContent=kind==='export'?'Exporter, conserver et envoyer mon carnet':'Importer et reprendre mon carnet';dialog.querySelector('#cg-body').innerHTML=element?bodies[kind]:bodies[kind].replace('Cliquez sur « Télécharger mon carnet JSON » ci-dessous.', 'Ouvrez l’application concernée, puis cliquez sur son bouton d’export. Dans le guide qui s’affiche, choisissez « Télécharger mon carnet JSON ».').replace('Cliquez sur « Choisir mon carnet JSON » ci-dessous, retrouvez le fichier et sélectionnez-le.', 'Ouvrez l’application concernée, puis cliquez sur son bouton d’import. Dans le guide qui s’affiche, choisissez « Choisir mon carnet JSON », retrouvez le fichier et sélectionnez-le.');dialog.querySelector('#cg-status').textContent='';const launch=dialog.querySelector('#cg-launch');launch.hidden=!element;launch.textContent=kind==='export'?'Télécharger mon carnet JSON':'Choisir mon carnet JSON';dialog.showModal();dialog.querySelector('[data-cg-close]').focus();}
 function close(){dialog.close();if(origin?.isConnected)origin.focus();}
 dialog.addEventListener('click',e=>{if(e.target.closest('[data-cg-close]'))close();if(e.target.closest('#cg-launch')){const element=trigger;if(!element?.isConnected){dialog.querySelector('#cg-status').textContent='Le contenu a changé. Fermez le guide puis relancez l’action depuis votre carnet.';return;}if(mode==='import')close();bypass=true;try{element.click();}finally{bypass=false;}if(mode==='export')dialog.querySelector('#cg-status').textContent='Retrouvez le fichier dans Téléchargements. S’il n’apparaît pas, vérifiez les messages de l’application et les téléchargements de votre navigateur.';}});
 dialog.addEventListener('cancel',()=>{setTimeout(()=>{if(origin?.isConnected)origin.focus();},0);});
 const exports='[data-export],[data-export-new],[data-export-carnet],[data-action="export"],#export';
 const imports='[data-import],[data-import-open],[data-action="import"],#emlv-native-import,#dst-import,[data-open-carnet-file]';
 document.addEventListener('click',e=>{
   if(bypass||e.target.closest('#emlv-carnet-guide'))return;
   const help=e.target.closest('[data-emlv-help]');if(help){e.preventDefault();e.stopImmediatePropagation();show(help.dataset.emlvHelp,null);return;}
   const ex=e.target.closest(exports);let im=e.target.closest(imports);
   if(!im){const input=e.target.closest('input[type="file"]');if(input&&(input.accept||'').includes('json'))im=input;}
   if(!im){const label=e.target.closest('label[for]');if(label){const input=document.getElementById(label.htmlFor);if(input?.type==='file'&&(input.accept||'').includes('json'))im=input;}}
   if(!ex&&!im)return;e.preventDefault();e.stopImmediatePropagation();show(ex?'export':'import',ex||im);
 },true);
})();

</script></body>
